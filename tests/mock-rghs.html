<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MOCK - OPD TID Details - Treatment &amp; Claim Submission</title>
<style>
  body{font:14px Arial,sans-serif;margin:0;background:#f4f6f9;color:#222}
  header{background:#0b5394;color:#fff;padding:12px 20px;font-size:18px}
  .wrap{padding:16px 20px;max-width:1100px}
  fieldset{background:#fff;border:1px solid #ccd;border-radius:4px;margin-bottom:12px}
  label{display:inline-block;min-width:170px}
  .f{margin:6px 0}
  .hide{display:none}
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4)}
  .modal.show{display:block}
  .modal-dialog{background:#fff;margin:80px auto;width:560px;padding:12px;border-radius:6px}
  table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:3px 6px}
</style>
</head>
<body>
<header>RGHS - OPD TID Details (MOCK for tests)</header>
<div class="wrap">
  <fieldset><legend>Search</legend>
    <div class="f"><label>Search by</label><select id="idType"><option value="">--Select--</option><option value="T">Transaction</option><option value="C">Card</option></select></div>
    <div class="f"><label>Transaction ID</label><input id="transactionid"> <button type="button" onclick="Search()">SEARCH</button></div>
    <input type="hidden" id="transid">
    <div class="f">Patient: <b id="pname"></b></div>
  </fieldset>
  <fieldset><legend>Doctor</legend>
    <div class="f"><label>Speciality</label><select id="opddepartment"></select> <input id="opddepttext" class="hide" placeholder="Other speciality"></div>
    <div class="f"><label>Empaneled doctor</label><select id="empaneledDocName"><option value="">--Select--</option></select></div>
    <div class="f"><label>RMC No</label><input id="rmcno"> <select id="rmcqual"><option value="UG">UG</option><option value="PG">PG</option></select>
      <button type="button" onclick="varifyRmc()">VERIFY</button></div>
    <div class="f"><label>Doctor (from RMC)</label><input id="opddocname" readonly></div>
    <div class="f"><label>Doctor speciality</label><input id="opddocspaciality" disabled></div>
  </fieldset>
  <fieldset><legend>Packages</legend>
    <div class="f"><select id="packagesearch"><option value="">--Select--</option><option value="0">Package Code</option><option value="1">Package Name</option></select>
      <input id="pkgcode"> <button type="button" onclick="SearchPackage()">SEARCH</button></div>
    <table id="packageDetailtable"><thead><tr><th>Code</th><th>Name</th><th>Rate</th></tr></thead><tbody></tbody></table>
    <div class="f"><label>Amount to claim</label><input id="amounttoclaim" readonly></div>
  </fieldset>
  <fieldset><legend>Prescription</legend>
    <div class="f"><label>Prescription date</label><input id="prescriptiondate"></div>
    <div class="f"><label>Validity</label><select id="prescriptionvalidity"><option value="">--Select--</option><option value="15">15 Days</option><option value="30">30 Days</option><option value="45">45 Days</option><option value="60">60 Days</option><option value="90">90 Days</option></select></div>
    <div class="f"><label>Chief complaints</label><textarea id="chiefDiagnosis"></textarea></div>
    <div class="f"><label>Diagnosis</label><textarea id="diagnosis"></textarea></div>
    <div class="f"><label>Invoice amount</label><input id="invoiceAmount"> <label>Discount</label><input id="discount"></div>
    <div class="f"><input type="checkbox" id="checkboxGenStmt"> I declare...</div>
  </fieldset>
  <fieldset><legend>Documents</legend>
    <div class="f"><label>Prescription</label><input type="file" id="doctorprescription"><input type="hidden" id="doctorprescriptionpath"></div>
    <div class="f"><label>Investigation</label><input type="file" id="invastigationreport"><input type="hidden" id="invastigationreportpath"></div>
    <div class="f"><label>Final bill</label><input type="file" id="finalbillreport"><input type="hidden" id="finalbillreportpath"></div>
    <div class="f"><label>Diagnosis report</label><input type="file" id="diagnosisreport"><input type="hidden" id="diagnosisreportpath"></div>
  </fieldset>
  <button type="button" onclick="confirmSave('1')">SAVE</button>
  <button type="button" onclick="confirmSave('2')">FINAL CLAIM SUBMISSION</button>
  <div style="height:400px"></div>
</div>

<div class="modal" id="msgModal"><div class="modal-dialog"><div class="modal-body"></div><button type="button" onclick="hideM('msgModal')">OK</button></div></div>
<div class="modal" id="successModal"><div class="modal-dialog"><div class="modal-body"></div><button type="button" onclick="hideM('successModal')">OK</button></div></div>
<div class="modal" id="addPackageModal"><div class="modal-dialog">
  <button type="button" class="close" onclick="CloseaddPackageModal()">×</button>
  <table id="searchpackagedetailtable"><thead><tr><th></th><th>Code</th><th>Name</th><th>Rate</th></tr></thead><tbody></tbody></table>
  <button type="button" onclick="addPackageDiv()">Add Package</button>
</div></div>

<script>
  const SPECS = ['General Medicine', 'General Surgery', 'Orthopaedics', 'Paediatric Medicine', 'Obstetrics and Gynaecology', 'ENT',
    'Ophthalmology', 'Dental', 'Physical Medicine and Rehabilitation', 'Nephrology', 'Urology', 'Any Other Speciality not mentioned above'];
  const $ = (id) => document.getElementById(id);
  const S = window.sessionStorage;
  window.__mock = { reloads: +(S.getItem('mockReloads') || 0), saved: '' };
  $('opddepartment').innerHTML = '<option value="">--Select--</option>' + SPECS.map((s, i) => `<option value="${i + 1}">${s}</option>`).join('');
  let DOCS = [], CODES = [];
  const ready = Promise.all([
    fetch('/__mock/doctors.json').then((r) => r.json()).then((d) => (DOCS = d)),
    fetch('/__mock/codes.json').then((r) => r.json()).then((c) => (CODES = c)),
  ]);
  const tid = S.getItem('mockTid');
  if (tid) { $('transid').value = tid; $('transactionid').value = tid; $('pname').textContent = 'TEST PATIENT'; }

  function msg(t) { $('msgModal').querySelector('.modal-body').textContent = t; $('msgModal').classList.add('show'); }
  function hideM(id) { $(id).classList.remove('show'); }
  function Search() {
    const v = $('transactionid').value.trim();
    if (!/^\d{16}$/.test(v)) { setTimeout(() => msg('Invalid Transaction ID'), 200); return; }
    S.setItem('mockTid', v); S.setItem('mockReloads', String(window.__mock.reloads + 1));
    setTimeout(() => location.reload(), 300);
  }
  $('opddepartment').addEventListener('change', async () => {
    await ready;
    const other = /Any Other/.test($('opddepartment').selectedOptions[0].text);
    $('opddepttext').classList.toggle('hide', !other);
    setTimeout(() => {
      $('empaneledDocName').innerHTML = '<option value="">--Select--</option>' + DOCS.map((d, i) => `<option value="D${i}">${d.name}</option>`).join('');
    }, 250);
  });
  const rmcOf = (d) => (d.rmc ? String(d.rmc) : String(d.reg).includes('/') ? String(d.reg).split('/')[1] : String(d.reg));
  async function varifyRmc() {
    await ready;
    const d = DOCS.find((x) => rmcOf(x) === $('rmcno').value.trim());
    setTimeout(() => {
      if (!d) return msg('RMC number not found');
      $('opddocname').value = d.name; $('opddocspaciality').disabled = false;
    }, 300);
  }
  async function SearchPackage() {
    await ready;
    const c = $('pkgcode').value.trim().toUpperCase();
    if ($('packagesearch').value !== '0') return msg('Select search type');
    const hit = CODES.filter((x) => String(x[0]).toUpperCase() === c);
    setTimeout(() => {
      if (!hit.length) return msg('No record found');
      $('searchpackagedetailtable').tBodies[0].innerHTML = hit.map((x) => `<tr><td><input type="checkbox"></td><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('');
      $('addPackageModal').classList.add('show');
    }, 250);
  }
  function CloseaddPackageModal() { hideM('addPackageModal'); }
  function addPackageDiv() {
    const tr = [...$('searchpackagedetailtable').tBodies[0].rows].find((r) => r.querySelector('input').checked);
    if (!tr) return msg('Select a package');
    $('packageDetailtable').tBodies[0].insertAdjacentHTML('beforeend', `<tr><td>${tr.cells[1].innerText}</td><td>${tr.cells[2].innerText}</td><td>${tr.cells[3].innerText}</td></tr>`);
    const tot = [...$('packageDetailtable').tBodies[0].rows].reduce((a, r) => a + parseFloat(r.cells[2].innerText), 0);
    $('amounttoclaim').value = String(tot);
    hideM('addPackageModal');
  }
  for (const id of ['doctorprescription', 'invastigationreport', 'finalbillreport', 'diagnosisreport']) {
    $(id).addEventListener('change', () => {
      const f = $(id).files[0];
      setTimeout(() => {
        if (!f || !/\.(pdf|zip)$/i.test(f.name)) return msg('Only PDF or ZIP');
        $(id + 'path').value = '/upload/' + f.name;
      }, 200);
    });
  }
  function confirmSave(k) {
    window.__mock.saved += k;
    if (k === '2') { $('successModal').querySelector('.modal-body').textContent = 'Claim submitted successfully'; $('successModal').classList.add('show'); }
  }
</script>
</body>
</html>
